<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Steer the Beam icon: a glowing beam line passing through a sensor ring (no text, no third-party marks) -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3155"/>
      <stop offset="1" stop-color="#0c1729"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)" stroke="#2f4a72" stroke-width="2"/>
  <!-- back half of the ring (behind the beam) -->
  <path d="M32 13 A8.5 19 0 0 0 32 51" fill="none" stroke="#5CC8E6" stroke-width="3.2" opacity="0.55"/>
  <!-- the beam -->
  <path d="M8 32 H56" stroke="#F2994A" stroke-width="5" stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>
  <path d="M8 32 H56" stroke="#FFC28A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- front half of the ring -->
  <path d="M32 13 A8.5 19 0 0 1 32 51" fill="none" stroke="#5CC8E6" stroke-width="3.2" filter="url(#glow)"/>
  <!-- the particle -->
  <circle cx="47" cy="32" r="3.6" fill="#ffffff" filter="url(#glow)"/>
</svg>
